name: publish
on:
  workflow_dispatch: {}
# 两次手动 dispatch 撞上同一版本时，后一个只是拿版本冲突收尾；真正的浪费是两个 runner 并行
# 跑同一份 check + publish，而且日志顺序会分不清哪一次落到了 registry。
concurrency:
  group: publish
  cancel-in-progress: false
permissions:
  contents: read
  # npm trusted publishing（OIDC）：官方文档里 id-token: write 是必需项，缺了报
  # ENEEDAUTH。runner 上没配过 trusted publisher 时这行无害——npm 探测不到 OIDC
  # 环境就回落到下面的 token，两条路并存，所以不必等 npmjs.com 配好才合。
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # action 按 tag 引用意味着上游动 tag 就等于本仓换了构建器。钉 commit SHA，
      # tag 版本写在同行注释里，升级时照着改这一行即可。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: 校验 token 形态（只读不写盘）
        env:
          TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          TOKEN_TIDY="$(printf '%s' "$TOKEN" | tr -d '\r\n[:space:]')"
          if [ -z "$TOKEN_TIDY" ]; then echo "NPM_TOKEN 是空的——去仓库 Settings → Secrets and variables → Actions 配上"; exit 1; fi
          if [ "$TOKEN" != "$TOKEN_TIDY" ]; then echo "注意：secret 里含空白/换行，已剔除后使用"; fi
          case "$TOKEN_TIDY" in
            npm_*) echo "token 形态：npm access token";;
            ghp_*|github_pat_*) echo "这是 GitHub token——发到公共 npm 需要 npm 站点自己的 token（www.npmjs.com → Access Tokens），GH 的 token 对 npmjs 无效"; exit 1;;
            *) echo "注意：前缀不是 npm_，请确认它确实是 npm 的 access token";;
          esac
          # 只报「有没有杂质」，不报长度：凭据的字符数是关于凭据本身的信息，CI 日志会长期留存。
          junk=$(printf %s "$TOKEN_TIDY" | tr -d "A-Za-z0-9_-" | wc -c | tr -d " ")
          echo "token 形态检查：非法字符数=$junk"
          if [ "$junk" != "0" ]; then
            echo "凭据里混进了非 token 字符（引号、说明文字之类）——请只贴 npm_ 开头那一串，不要带引号"
            exit 1
          fi
      - name: registry 预检（本包现状与依赖库可见性）
        env:
          TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          TOKEN_TIDY="$(printf '%s' "$TOKEN" | tr -d '\r\n[:space:]')"
          echo "whoami: $(curl -s -H "Authorization: Bearer $TOKEN_TIDY" "https://registry.npmjs.org/-/whoami")"
          # 本包自身也要查：只查依赖的话，「版本号没进 main 就触发 workflow」这个最常见的
          # 失败模式预检根本发现不了，只能等 publish 自己以版本冲突收尾。
          self=$(curl -s -o /dev/null -w "%{http_code}" "https://registry.npmjs.org/@jayyuen66%2fdsh-session-rescue")
          echo "读本包：HTTP $self"
          case "$self" in
            404) echo "判读：首发（正常）";;
            200) echo "判读：已发过——确认 package.json 的 version 比 registry 上的新，否则 publish 会撞版本冲突";;
            *) echo "预检失败：本包读取返回 $self"; exit 1;;
          esac
          code=$(curl -s -o /dev/null -w "%{http_code}" "https://registry.npmjs.org/@jayyuen66%2fdsh-plugin-shared")
          echo "读 @jayyuen66/dsh-plugin-shared：HTTP $code"
          echo "判读：200=依赖库已公开，可以发；404=shared 还没发到 npmjs，先发它（本包 pnpm install 会因此取不到依赖）"
          [ "$code" = "200" ] || exit 1
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      # prepack 会重建 host.js / client.js / types/，产物不入库也发得出去
      # 凭据走 NODE_AUTH_TOKEN：setup-node 配了 registry-url 之后会设
      # NPM_CONFIG_USERCONFIG 指向它自己生成的那份 .npmrc，npm 只读那一份，
      # $HOME/.npmrc 会被完全忽略——所以 token 必须以环境变量注入，不能写文件。
      # 但注入的必须是**与上面预检同款清洗过的值**：预检用 TOKEN_TIDY（剔 \r\n 与空白），
      # 这里若直接给裸 secret，则 secret 尾部一个换行就让「whoami 通过、publish 401」，
      # 而上面那句「已剔除后使用」对这一步是假的。一处清洗、两步同口径。
      # --provenance：上面的 id-token: write 就是给它用的，不加等于白拿 OIDC；
      # 消费方在 npm 页面就能看到这一版是从哪个仓库、哪次构建出来的。
      # --publish-wait-timeout：等 registry 真正放出这个版本并对 tarball 回 HEAD，
      # 于是「发出去了但装不上」在 workflow 里就红，而不是等用户报障才发现。
      - run: |
          export NODE_AUTH_TOKEN="$(printf '%s' "$TOKEN" | tr -d '\r\n[:space:]')"
          pnpm publish --no-git-checks --access public --provenance --publish-wait-timeout 600000
        env:
          TOKEN: ${{ secrets.NPM_TOKEN }}
