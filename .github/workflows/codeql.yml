# CodeQL：两格并跑。
#
# javascript-typescript 扫源码；actions 扫 .github/workflows/*.yml —— 后者正是
# 本仓这一层最需要的一种检查：工作流里的表达式注入、过度权限、可被 fork PR 触发的
# 危险形态，都是「代码全绿但门禁本身有洞」那一类。
#
# 不给 build-mode：JS/TS 与 actions 都走默认的 none，不需要编译。
name: codeql
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 手动入口：修完一条告警想立刻复验时，不必等下一周的 cron。
  workflow_dispatch: {}
  schedule:
    - cron: "23 4 * * 1"
# 组键带事件名：周度扫描与 main 上的 push 落在不同组，前者不会因为一次 push 被取消。
# 取消只给 push 与 pull_request：同一分支连推几次时，旧那一轮的扫描没人还要它的结论；
# 其余事件（schedule / workflow_dispatch）各占一组，互不覆盖。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
# 工作流级只给读；写入权限挂在 job 上，因为只有上传 SARIF 那一步需要它。
permissions:
  contents: read
jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # 上传 SARIF 到 code scanning 面板所必需。
      security-events: write
      # 不写 packages: read——本文件没有任何 packs / queries 输入，init 与 analyze 只用
      # codeql-action 自带的默认套件，读 registry 上没有的东西这一步今天没有消费者。
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # 两个标识都按官方清单写死：javascript-typescript 覆盖 JS 与 TS；
        # actions 覆盖本仓 .github/workflows 下的工作流文件。
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 本仓的 workflow 不用 git 写动词，token 没必要留在 .git/config 里：
          # 后续步骤会跑仓库自己的 install/构建/测试脚本，也就跑得到依赖里的脚本。
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          languages: ${{ matrix.language }}
          # actions 专用 bundle 资产当前在 releases 上返回 502，而同一版本的完整 bundle
          # 可用（javascript-typescript 格本来就用它）。两格统一指到完整 bundle；抬
          # codeql-action 版本时一并复核这个 URL。
          tools: https://github.com/github/codeql-action/releases/download/codeql-bundle-v2.27.4/codeql-bundle-linux64.tar.zst
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          category: /language:${{ matrix.language }}
        # fork 来的 pull_request 里 GITHUB_TOKEN 被强制降为只读，上面那项 security-events: write
        # 拿不到，上传 SARIF 会以 `Resource not accessible by integration` 失败——那是仓库设置
        # （Actions → General → Send write tokens to workflows from pull requests）的事，
        # 不是贡献者的缺陷。所以这一支在 fork PR 上不阻塞合并，扫描结论仍从 cron 与 push 进面板。
        # 对本仓自己的 pull_request（同仓库分支）仍然判红。
        continue-on-error: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
