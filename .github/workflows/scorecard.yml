# OpenSSF Scorecard：供应链体检。
#
# 它查的正是本仓这一层关心的东西——脚本注入、token 权限、依赖是否钉版、分支保护是否
# 存在。结果同时进 code scanning 面板与 OpenSSF 公有 API（本仓是 public 仓）。
#
# publish_results 只在默认分支上有效：上传的身份由 OIDC 换得，所以要 id-token: write。
name: scorecard
on:
  # 分支保护规则变更时重跑，否则 Branch-Protection 这项检查只会停在旧值上。
  # ruleset 变更没有对应的触发事件：GitHub 的 Actions 触发器清单里没有 ruleset 事件，
  # scorecard 自己用默认 GITHUB_TOKEN 读 Repository Rules，所以 ruleset 改动要靠下面的
  # schedule 或手动 dispatch 补上。
  branch_protection_rule:
  # 手动入口：同上。注意下面的 if 要求「在默认分支上跑」，所以在功能分支上手跑时该 job
  # 会被跳过——这不是故障。
  workflow_dispatch: {}
  schedule:
    - cron: "23 4 * * 1"
# 入口只留 branch_protection_rule / workflow_dispatch / schedule。原先还挂了 push:[main]：
# 官方模板没有这一条，而 scorecard 的依赖钉版、分支保护、CI-Tests 都是按周期数据算的检查，
# main 上每合并一次就跑一遍完整体检、以同名 category 覆盖上一份 code scanning 结果（与 cron
# 那一轮谁后完成谁生效）、再往 OpenSSF 公有 API 发一次，换来的增量信息接近零，还带限流风险。
# concurrency 的真实语义写在这里，别按字面期待：cancel-in-progress: false 只保住**在跑**的那一轮，
# 同组里已排队的 pending 运行仍会被新进入的那一个取消（官方文档：any existing pending job or
# workflow in the same concurrency group will be canceled and the new queued job takes its place）。
# 按事件名分组的作用是让 schedule 与 workflow_dispatch 各占一组、互不覆盖，不是「同组排队全保」。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
# 工作流级只留读代码的权限；写权限只挂在 analysis job 上。
permissions:
  contents: read
jobs:
  analysis:
    name: scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # publish_results: true 只在默认分支生效，所以在非默认分支上不跑这条。
    if: github.event.repository.default_branch == github.ref_name
    # 这个 job 的步骤清单是一条约束，不是一段说明：`id-token: write` 在 GitHub 的权限模型里
    # 只能声明到 job 级，于是组内每一步都拿得到 OIDC 身份，`security-events: write` 同理。
    # 现在四枚 action 全部按 commit SHA 钉版、checkout 关掉了 persist-credentials，风险由这两条压住；
    # 往后往这里追加任何 `run` 步骤都会自动继承这两项写权限，等于把 OIDC 换到的身份交给仓库脚本。
    # 要加步骤就一并把它钉成 SHA 并说清它为什么需要写权限，别默认它能进来跑一段脚本。
    permissions:
      security-events: write
      id-token: write
      # job 级 permissions 一旦写了，没列出的项一律是 none，checkout 也就读不到仓库内容。
      # 这里显式补回来：它要的是读，与上面两项写权限不冲突。
      contents: read
      # CI-Tests 这项检查要枚举 workflow run 才算得出「CI 是否跑过且通过」：缺 actions: read 时
      # 那次列举会被 403 掉，scorecard 不报错而是把该检查记成「没有证据」，分数静默偏低。
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 不让 checkout 把 token 留在 .git/config 里：后续步骤不该能借它推代码。
          persist-credentials: false
      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      # SARIF 先上传：结论显示在这里（code scanning 面板）。留档那一步排在它后面，
      # 这样 artifact 存储配额或并发写入限制挡住留档时，本轮体检结论已经交到面板上。
      # 两步都不做 continue-on-error——留档失败也是一次真失败，只是不该由它决定结论有没有送到。
      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: results.sarif
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
